<input type="date" name="birth_date" id="birth_date">
<input type="text" name="age" id="age">
<script> 
 $(document).ready(function(){
       $("#birth_date").on('change', function(){
           var mdate = $("#birth_date").val().toString();
           var yearThen = parseInt(mdate.substring(0,4), 10);
           var monthThen = parseInt(mdate.substring(5,7), 10);
           var dayThen = parseInt(mdate.substring(8,10), 10);
           
           var today = new Date();
           var birthday = new Date(yearThen, monthThen-1, dayThen);
           
           var differenceInMilisecond = today.valueOf() - birthday.valueOf();
           
           var year_age = Math.floor(differenceInMilisecond / 31536000000);
           $("#age").val(year_age);
           
       });
   });
   
</script>



<!--Diffrence between two dates-->
<div class="col-md-3"> 
  <label class="form-label">FROM DATE</label><br>
  <input type="date"  class="form-control" name="from_date[]" id="ug_from_date">  
</div> 
<div class="col-md-3"> 
  <label class="form-label">TO DATE</label><br>
  <input type="date"  class="form-control" name="to_date[]" onblur="UGtoDate()" id="ug_to_date">  
</div>
<script>
function UGtoDate(){
	var ug_from_date=$("#ug_from_date").val();
	var ug_to_date=$("#ug_to_date").val();
	var days = daysdifference(ug_from_date, ug_to_date);  
	var years= Math.round(days/365);
	alert(years);
	exit;
	
}


function daysdifference(firstDate, secondDate){  
    var startDay = new Date(firstDate);  
    var endDay = new Date(secondDate);  
  
// Determine the time difference between two dates     
    var  millisBetween  =  startDay .getTime () - endDay.getTime ();  
  
// Determine the number of days between two dates  
    var  days  =  millisBetween  / (1000 * 3600 * 24);  
  
// Show the final number of days between dates     
    return Math.round(Math.abs(days));  
}  

</script>
